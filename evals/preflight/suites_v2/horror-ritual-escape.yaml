# Suite Capa B-1 v2 — horror-ritual-escape (familia: Horror)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de terror de escape ritual en Godot donde el jugador debe reunir cinco símbolos sagrados repartidos por una mansión mientras una sombra lo acecha y va poseyendo habitaciones. El HUD muestra los símbolos recogidos de 5, la cordura que baja al mirar a la sombra y el mapa de habitaciones seguras en miniatura. Para recoger un símbolo hay que completar un pequeño puzle de ordenar velas antes de que la sombra llegue a la habitación. La victoria se alcanza al colocar los cinco símbolos en el altar del sótano y escapar por la trampilla, y la derrota al perder toda la cordura o ser alcanzado por la sombra. Tras el final se ofrece reiniciar la mansión con los símbolos reubicados."

task: horror-ritual-escape
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: hud-símbol
    kind: label_match
    text: símbol
    desc: "el HUD muestra símbolos recogidos"
  - id: hud-cordura
    kind: label_match
    text: cordura
    desc: "el HUD muestra cordura"
  - id: hud-mapa
    kind: label_match
    text: mapa
    desc: "el HUD muestra mapa de habitaciones seguras"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-simbolo
    kind: resource_within_bounds
    label: [simbolo, símbolo]
    max: 5
    frames: 150
    desc: "el HUD de símbolos recogidos no desborda 5"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
