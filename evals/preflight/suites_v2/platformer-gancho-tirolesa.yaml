# Suite Capa B-1 v2 — platformer-gancho-tirolesa (familia: Platformer)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de plataformas 2D en Godot con un gancho de agarre: el jugador lanza un gancho a puntos de anclaje fijos en el escenario, se impulsa oscilando como en una tirolesa y puede soltar en el momento justo para alcanzar islas lejanas. El HUD muestra tiempo restante, diamantes recogidos y un medidor de cargas de gancho, y los enemigos se superan saltando encima o enganchándolos con el gancho. Victoria al llegar a la meta flotante antes de que termine el cronómetro, derrota al caer al vacío o al agotarse el tiempo, y tras el final puedes reiniciar el nivel. Incluye cinemática de impulso al soltar, plataformas que se mueven en bucle y una ruta alternativa que premia el uso experto del gancho."

task: platformer-gancho-tirolesa
