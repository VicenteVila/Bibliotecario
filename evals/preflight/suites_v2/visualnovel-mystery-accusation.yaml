# Suite Capa B-1 v2 — visualnovel-mystery-accusation (familia: Visual novel)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea una novela visual de misterio en Godot: interpretas a una detective que interroga a cinco sospechosos eligiendo opciones de diálogo, y cada respuesta abre o cierra ramas distintas de la conversación. La pantalla muestra siempre un HUD con la hora del día, las pistas recopiladas y el nivel de confianza de cada sospechoso. Durante la investigación puedes examinar escenas para hallar pistas ocultas que desbloquean preguntas nuevas. El juego termina en victoria cuando acusas al culpable correcto con al menos tres pistas en el HUD, y en derrota (finales malos) cuando acusas al inocente o se te acaba el tiempo. Al ver cualquier final aparece una pantalla con la opción de reiniciar la investigación desde cero."

task: visualnovel-mystery-accusation
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-hora
    kind: label_match
    text: hora
    desc: "el HUD muestra hora del día"
  - id: hud-pista
    kind: label_match
    text: pista
    desc: "el HUD muestra pistas recopiladas"
  - id: hud-confianza
    kind: label_match
    text: confianza
    desc: "el HUD muestra confianza de cada sospechoso"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
