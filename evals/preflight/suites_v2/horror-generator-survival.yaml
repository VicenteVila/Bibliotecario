# Suite Capa B-1 v2 — horror-generator-survival (familia: Horror)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de terror de supervivencia por tiempo en Godot: el jugador queda encerrado en un parque abandonado y debe aguantar cinco minutos encendiendo generadores repartidos por el mapa para mantener la luz. El HUD muestra el cronómetro restante, los generadores activados de 4, la energía de la linterna y un medidor de terror que sube en la oscuridad y baja cerca de las luces. Un monstruo vagará más rápido cuanto más generadores has encendido, y si te toca pierdes vida; quedarte sin vida o sin tiempo antes de activar los cuatro generadores es derrota, sobrevivir los cinco minutos con los cuatro activos es victoria. Puedes correr, distraer al monstruo con ruido y recargar la linterna en los generadores. La pantalla final muestra el resultado y permite reiniciar la ronda completa."

task: horror-generator-survival
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: hud-cronom
    kind: label_match
    text: cronom
    desc: "el HUD muestra cronómetro restante"
  - id: hud-generador
    kind: label_match
    text: generador
    desc: "el HUD muestra generadores activados"
  - id: hud-energ
    kind: label_match
    text: energ
    desc: "el HUD muestra energía de la linterna"
  - id: hud-terror
    kind: label_match
    text: terror
    desc: "el HUD muestra medidor de terror"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-generador
    kind: resource_within_bounds
    label: [generador]
    max: 4
    frames: 150
    desc: "el HUD de generadores activados no desborda 4"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
