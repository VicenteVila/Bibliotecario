# Suite Capa B-1 v2 — openworld-vuelo-planeador (familia: Open World)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de mundo abierto de exploración aérea: el jugador planea con un ala delta entre picos flotantes y ruinas suspendidas, recogiendo 10 artefactos repartidos por el mapa. Un HUD visible muestra artefactos recolectados, altitud y velocidad. Al reunir los 10 artefactos se obtiene la victoria; si cae al vacío o pierde todo el control del planeo, el juego termina en derrota y permite reiniciar. El viento cambia suavemente para que cada vuelo se sienta distinto."

task: openworld-vuelo-planeador
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: hud-artefact
    kind: label_match
    text: artefact
    desc: "el HUD muestra artefactos recolectados"
  - id: hud-altitud
    kind: label_match
    text: altitud
    desc: "el HUD muestra altitud"
  - id: hud-velocidad
    kind: label_match
    text: velocidad
    desc: "el HUD muestra velocidad"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-artefact
    kind: resource_within_bounds
    label: [artefact]
    max: 10
    frames: 150
    desc: "el HUD de artefactos no desborda 10"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: falls
    kind: falls
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 90
    desc: "el jugador cae tras teleport arriba"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
