# Suite Capa B-1 v2 — strategy-guerra-economica (familia: Strategy)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de estrategia de guerra económica en tiempo real: el jugador gestiona minas de oro y granjas para financiar el entrenamiento de soldados, que envía a atacar la base enemiga mientras defiende la propia. Un HUD visible muestra los recursos por segundo, el ejército actual y la salud de ambas bases. Destruir la base enemiga da la victoria; si la base del jugador es destruida, hay derrota y se puede reiniciar la partida. Incluye un punto de reclutamiento y rutas de ataque simples por el mapa."

task: strategy-guerra-economica
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-recurso
    kind: label_match
    text: recurso
    desc: "el HUD muestra recursos por segundo"
  - id: hud-ejércit
    kind: label_match
    text: ejércit
    desc: "el HUD muestra ejército actual"
  - id: hud-salud
    kind: label_match
    text: salud
    desc: "el HUD muestra salud de las bases"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
