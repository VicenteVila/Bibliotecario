# Suite Capa B-1 v2 — strategy-conquista-territorios (familia: Strategy)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de estrategia de conquista en un mapa de territorios adyacentes: el jugador controla un imperio inicial y ataca a sus vecinos acumulando tropas para tomar regiones una a una. Un HUD visible muestra tropas disponibles, territorios controlados y el turno del rival. Controlar el 75% del mapa otorga la victoria; si el rival conquista la capital del jugador o reduce sus territorios a uno solo, hay derrota y se puede reiniciar. En cada turno el rival toma decisiones sencillas de ataque y defensa."

task: strategy-conquista-territorios
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-tropa
    kind: label_match
    text: tropa
    desc: "el HUD muestra tropas disponibles"
  - id: hud-territorio
    kind: label_match
    text: territorio
    desc: "el HUD muestra territorios controlados"
  - id: hud-turno
    kind: label_match
    text: turno
    desc: "el HUD muestra turno del rival"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
