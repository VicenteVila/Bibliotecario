# Suite Capa B-1 v2 — racing-obstacle-dodge (familia: Racing)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de carreras de obstáculos 2D: el jugador pilota un kart por una carretera infinita esquivando conos, charcos y otros vehículos que se acercan. El HUD muestra la distancia recorrida, la puntuación y la vida restante. Esquivar obstáculos suma puntos y llegar a dos mil metros de distancia da la victoria, mientras que chocar demasiadas veces y perder toda la vida causa derrota. Cuando la carrera termina, ya sea por victoria o derrota, se puede reiniciar para intentar superar la puntuación."

task: racing-obstacle-dodge
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Coche, Moto, Bike, Vehiculo, Vehículo, Vehicle, Kart]
    desc: "el avatar del jugador existe como nodo"
  - id: hud-distancia
    kind: label_match
    text: distancia
    desc: "el HUD muestra distancia recorrida"
  - id: hud-puntua
    kind: label_match
    text: puntua
    desc: "el HUD muestra puntuación"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vida restante"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-distancia
    kind: resource_within_bounds
    label: [distancia]
    max: 2000
    frames: 150
    desc: "el HUD de distancia recorrida no desborda 2000"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Coche, Moto, Bike, Vehiculo, Vehículo, Vehicle, Kart]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
