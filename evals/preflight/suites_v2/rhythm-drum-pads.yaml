# Suite Capa B-1 v2 — rhythm-drum-pads (familia: Rhythm)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de pads de batería rítmico 2D: cuatro pads aparecen en pantalla y el sistema muestra una secuencia de golpes que el jugador debe repetir en el orden y momento exactos, con secuencias cada vez más largas. Un HUD muestra la ronda alcanzada, la puntuación acumulada y los intentos fallidos. Completar quince rondas seguidas sin errores da la victoria; cometer tres errores causa derrota. Al fallar o ganar se puede reiniciar desde la primera ronda."

task: rhythm-drum-pads
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-ronda
    kind: label_match
    text: ronda
    desc: "el HUD muestra ronda alcanzada"
  - id: hud-puntua
    kind: label_match
    text: puntua
    desc: "el HUD muestra puntuación acumulada"
  - id: hud-intento
    kind: label_match
    text: intento
    desc: "el HUD muestra intentos fallidos"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-intento
    kind: resource_within_bounds
    label: [intento]
    max: 3
    frames: 150
    desc: "el HUD de intentos fallidos no desborda 3"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
