# Suite Capa B-1 v2 — rhythm-lane-defense (familia: Rhythm)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de defensa rítmica 2D: enemigos aparecen en cuatro carriles avanzando al ritmo de la música y el jugador debe presionar la tecla del carril correspondiente en el momento exacto para repelerlos antes de que lleguen a la base. Un HUD muestra la salud de la base, la oleada actual y la puntuación. Sobrevivir a diez oleadas completas da la victoria; si la salud de la base llega a cero, es derrota. Después de cada partida se puede reiniciar y volver a intentarlo."

task: rhythm-lane-defense
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-salud
    kind: label_match
    text: salud
    desc: "el HUD muestra salud de la base"
  - id: hud-oleada
    kind: label_match
    text: oleada
    desc: "el HUD muestra oleada actual"
  - id: hud-puntua
    kind: label_match
    text: puntua
    desc: "el HUD muestra puntuación"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-oleada
    kind: resource_within_bounds
    label: [oleada]
    max: 10
    frames: 150
    desc: "el HUD de oleada actual no desborda 10"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
