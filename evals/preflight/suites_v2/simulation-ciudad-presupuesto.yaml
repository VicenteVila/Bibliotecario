# Suite Capa B-1 v2 — simulation-ciudad-presupuesto (familia: Simulation)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de simulación de ciudad en Godot donde colocas zonas residenciales, comerciales e industriales, construyes servicios como escuelas y parques, y cobras impuestos cada ciclo. La felicidad, la población y el presupuesto se actualizan en un HUD visible y la gente se muda o se va según tu gestión. Victoria al llevar la población y la felicidad a los objetivos marcados en el panel de metas, derrota si la alcaldía quiebra o la felicidad se desploma hasta el límite, y al final puedes reiniciar el municipio. Incluye un gráfico de evolución de ingresos y gastos y coste creciente por cada nueva construcción."

task: simulation-ciudad-presupuesto
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-felicidad
    kind: label_match
    text: felicidad
    desc: "el HUD muestra felicidad"
  - id: hud-poblac
    kind: label_match
    text: poblac
    desc: "el HUD muestra población"
  - id: hud-presupuesto
    kind: label_match
    text: presupuesto
    desc: "el HUD muestra presupuesto"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
