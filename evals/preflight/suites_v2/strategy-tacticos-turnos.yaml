# Suite Capa B-1 v2 — strategy-tacticos-turnos (familia: Strategy)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego táctico por turnos en un mapa de cuadrícula: el jugador mueve 4 unidades de tipos variados (arquero, sanador, tanque y asesino) contra un ejército rival, usando cobertura y ventajas de posición. Un HUD visible muestra el turno actual, la salud de cada unidad y el objetivo de la batalla. Eliminar a todas las unidades enemigas da la victoria; si todas las unidades del jugador mueren, hay derrota y se puede reiniciar la batalla. Incluye pantallas claras de victoria y derrota con opción de jugar de nuevo."

task: strategy-tacticos-turnos
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-turno
    kind: label_match
    text: turno
    desc: "el HUD muestra turno actual"
  - id: hud-salud
    kind: label_match
    text: salud
    desc: "el HUD muestra salud de las unidades"
  - id: hud-objetivo
    kind: label_match
    text: objetivo
    desc: "el HUD muestra objetivo de la batalla"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
