    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-dinero
    kind: label_match
    text: dinero
    desc: "el HUD muestra dinero"
  - id: hud-visitante
    kind: label_match
    text: visitante
    desc: "el HUD muestra visitantes dentro"
  - id: hud-satisfacc
