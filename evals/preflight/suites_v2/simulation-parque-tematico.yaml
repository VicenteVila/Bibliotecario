# Suite Capa B-1 v2 — simulation-parque-tematico (familia: Simulation)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de simulación de parque temático en Godot donde colocas atracciones, puestos de comida y bancos, y los visitantes caminan por los caminos disfrutando o quejándose según la calidad del recorrido. El HUD muestra dinero, visitantes dentro, satisfacción general y valor de la entrada, y cada atracción consume mantenimiento continuo. Victoria al alcanzar la puntuación de prestigio del parque marcada en el panel antes de que se acabe la temporada, derrota si la satisfacción o la caja llegan a cero, y desde la pantalla final puedes reiniciar el parque. Incluye colas visibles en las atracciones y la posibilidad de subir el precio de la entrada cuando la demanda lo permita."

task: simulation-parque-tematico
checks:
