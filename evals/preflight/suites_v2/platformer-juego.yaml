# Suite Capa B-1 v2 — platformer-juego (tarea ancla de Hito 16)
# Puerto VERBATIM de la suite v1 ratificada 2026-10-14
# (suites/platformer-juego.yaml) + `no_runtime_errors`, la única adición
# runner-side de v2. Escrita 2026-10-21 ANTES de la corrida oficial U1-U6:
# run_fase2_b2.py la exige en U6 y el fichero nunca existió (intento 0 de la
# corrida: U5 OK, U6 abortado, 0 llamadas de juez, coste 0).
#
# Regla: cada check verifica UNA feature pedida en la instrucción
# (GameDevBench §2.2); nada inventado — los checks son los de la v1 ya
# validada, mismos ids y parámetros. No se añaden los kinds nuevos
# `hud_value_changes` ni `restart_resets`: el workspace no define acciones
# propias en project.godot ([input] no existe), así que `restart_resets` no
# admite un `restart_action` honesto, y meterlos a última hora sería escribir
# checks sin validar justo antes de medir. Cobertura pendiente → benchmark
# nuevo (la suite se congela al escribirse, §5.2.2.c).
#
# Instrucción: "juego de plataformas 2D completo: el jugador se mueve con
# flechas/teclas y salta con espacio, colisiona con plataformas y suelo, hay
# una meta al final del nivel que da la victoria, caer al vacío causa derrota,
# tras game over se puede reiniciar, y el jugador recoge monedas que suman
# puntos con un HUD visible. Incluye gravedad, coyote time básico y cámara
# que sigue al jugador."

task: platformer-juego
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"

  # "el jugador se mueve con flechas/teclas"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, player, heroe, héroe]
    desc: "hay un nodo jugador"
  - id: jugador-fisica
    kind: node_is
    names: [Player, Jugador, player]
    is: CharacterBody2D
    desc: "el jugador es CharacterBody2D (física real)"
  - id: jugador-mueve
    kind: moves
    names: [Player, Jugador, player]
    action: ui_right
    frames: 45
    desc: "el jugador se mueve bajo input de flecha"

  # "salta con espacio"
  - id: jugador-salta
    kind: jump
    names: [Player, Jugador, player]
    frames: 30
    desc: "el jugador salta bajo ui_accept (espacio)"

  # "colisiona con plataformas y suelo"  +  "Incluye gravedad"
  # Un único check sin teleport: is_on_floor()==true al asentar implica que la
  # gravedad lo bajó Y que la colisión lo detuvo. Ambas a la vez.
  - id: colisiona-y-gravedad
    kind: settles
    names: [Player, Jugador, player]
    frames: 90
    desc: "el jugador asienta en el suelo (gravedad + colisión, sin teleport)"

  # "una meta al final del nivel que da la victoria"
  - id: meta-existe
    kind: node_exists
    names: [Goal, Meta, Finish, Exit, Victoria, Win, goal]
    desc: "hay un nodo meta/victoria"

  # "el jugador recoge monedas"
  - id: monedas-existen
    kind: node_exists
    names: [Coin, Moneda, coin, Oro, Pickable]
    desc: "hay monedas/objetos recogibles"

  # "suman puntos con un HUD visible"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: hud-puntos
    kind: label_match
    text: puntos
    desc: "el HUD muestra puntos"

  # "cámara que sigue al jugador"
  - id: camara-sigue
    kind: camera_follows
    names: [Player, Jugador, player]
    desc: "la cámara sigue al jugador"

  # adición v2 (runner-side): sin errores de script en caliente
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
