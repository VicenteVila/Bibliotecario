# Suite Capa B-1 v2 — rhythm-note-highway (familia: Rhythm)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de ritmo 2D estilo guitarra: notas de distintos colores caen desde arriba hacia una zona de acierto y el jugador debe pulsar la tecla correspondiente justo cuando cada nota llegue a la línea. Un HUD muestra la puntuación, la racha de aciertos consecutivos y una barra de vida que baja cada vez que se falla. Superar la puntuación mínima al final de la canción da la victoria; si la barra de vida llega a cero antes, es derrota. Cuando la canción termina, se puede reiniciar para intentar mejorar la marca."

task: rhythm-note-highway
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-puntua
    kind: label_match
    text: puntua
    desc: "el HUD muestra puntuación"
  - id: hud-racha
    kind: label_match
    text: racha
    desc: "el HUD muestra racha de aciertos"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra barra de vida"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
