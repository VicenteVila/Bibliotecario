# Suite Capa B-1 v2 — horror-stealth-hiding (familia: Horror)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de terror de sigilo en Godot: el jugador debe completar cinco tareas repartidas por una casa (reparar un cuadro, apagar velas, recoger objetos) mientras un asesino patrulla y lo escucha si camina demasiado rápido. El HUD muestra las tareas completadas de 5, el pulso del corazón que sube cuando el asesino está cerca y una barra de agotamiento que disminuye al correr. Puedes esconderte en armarios y taquillas para que el asesino pierda tu rastro, pero salir en el momento equivocado lo atrae. La victoria se logra terminar las cinco tareas y salir por la puerta principal, la derrota cuando el asesino te atrapa. En la pantalla de captura o escape hay un botón para reiniciar la casa."

task: horror-stealth-hiding
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: hud-tarea
    kind: label_match
    text: tarea
    desc: "el HUD muestra tareas completadas"
  - id: hud-pulso
    kind: label_match
    text: pulso
    desc: "el HUD muestra pulso del corazón"
  - id: hud-agotam
    kind: label_match
    text: agotam
    desc: "el HUD muestra barra de agotamiento"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-tarea
    kind: resource_within_bounds
    label: [tarea]
    max: 5
    frames: 150
    desc: "el HUD de tareas completadas no desborda 5"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
