# Suite Capa B-1 v2 — tycoon-colonia-espacial (familia: Tycoon)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de tycoon de colonia espacial en Marte: el jugador construye generadores de energía, extractores de agua y granjas de comida para mantener con vida a 20 colonos mientras expande la base. Un HUD visible muestra energía, agua, comida, población y el día de la misión. Mantener a todos los colonos con vida durante 5 días da la victoria; si un recurso crítico se agota y los colonos no sobreviven, hay derrota y se puede reiniciar la misión. Las tormentas de arena reducen la energía de los paneles solares en ciertos días."

task: tycoon-colonia-espacial
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-energ
    kind: label_match
    text: energ
    desc: "el HUD muestra energía"
  - id: hud-agua
    kind: label_match
    text: agua
    desc: "el HUD muestra agua"
  - id: hud-comida
    kind: label_match
    text: comida
    desc: "el HUD muestra comida"
  - id: hud-poblac
    kind: label_match
    text: poblac
    desc: "el HUD muestra población"
  - id: hud-día
    kind: label_match
    text: día
    desc: "el HUD muestra día de la misión"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-poblac
    kind: resource_within_bounds
    label: [poblac]
    max: 20
    frames: 150
    desc: "el HUD de población no desborda 20"
  - id: cota-dia
    kind: resource_within_bounds
    label: [dia, día]
    max: 5
    frames: 150
    desc: "el HUD de día de la misión no desborda 5"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
