# Suite Capa B-1 v2 — idle-mazmorra-heroes (familia: Idle)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego idle de mazmorra en Godot donde reclutas héroes que pelean automáticamente contra oleadas de monstruos por pisos, y tú decides a qué piso enviarlos y qué equipo comprarles. El HUD muestra monedas, piso alcanzado, héroes activos, daño por segundo del grupo y un temporizador de oleada. Victoria al conquistar el piso 50 indicado en el marcador, derrota si una oleada arrasa a todos tus héroes y no puedes reclutar a nadie más, y tras cada final puedes reiniciar la expedición. Incluye subidas de nivel de héroe con elección de mejora y una sala del tesoro que aparece cada ciertos pisos."

task: idle-mazmorra-heroes
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-moneda
    kind: label_match
    text: moneda
    desc: "el HUD muestra monedas"
  - id: hud-piso
    kind: label_match
    text: piso
    desc: "el HUD muestra piso alcanzado"
  - id: hud-héroe
    kind: label_match
    text: héroe
    desc: "el HUD muestra héroes activos"
  - id: hud-daño
    kind: label_match
    text: daño
    desc: "el HUD muestra daño por segundo"
  - id: hud-temporiz
    kind: label_match
    text: temporiz
    desc: "el HUD muestra temporizador de oleada"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-piso
    kind: resource_within_bounds
    label: [piso]
    max: 50
    frames: 150
    desc: "el HUD de piso alcanzado no desborda 50"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
