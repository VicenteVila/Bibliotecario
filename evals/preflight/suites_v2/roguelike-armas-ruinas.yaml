# Suite Capa B-1 v2 — roguelike-armas-ruinas (familia: Roguelike)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un roguelike de acción en Godot donde recoges armas y modificadores que se combinan entre sí (por ejemplo fuego más proyectiles múltiples o hielo más rebote) y cada planta te ofrece una recompensa con dos o tres opciones al azar. El HUD muestra vida, armas equipadas con sus combinaciones, planta actual y un contador de maldiciones que añaden dificultad a cambio de botín. Victoria al llegar al núcleo final y destruirlo, derrota si las maldiciones te superan y la vida llega a cero, y puedes reiniciar con una generación de recompensas distinta. Incluye reroll limitado de las opciones de recompensa y un marcador de combos encadenados."

task: roguelike-armas-ruinas
