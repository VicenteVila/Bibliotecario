# Suite Capa B-1 v2 — visualnovel-romance-routes (familia: Visual novel)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea una novela visual romántica en Godot ambientada en una academia, donde el jugador conversa con cuatro personajes y cada elección modifica una barra de afinidad visible en el HUD junto al retrato y el nombre del personaje actual. El jugador avanza por capítulos leyendo diálogos, eligiendo respuestas y regalando objetos que suben o bajan la afinidad de manera acumulativa. Hay una ruta de victoria cuando alcanzas el capítulo final con la afinidad del personaje elegido al máximo y obtienes su final feliz, y rutas de derrota cuando la afinidad cae a cero o llegas al final sin ninguna ruta desbloqueada. Tras mostrarse el final correspondiente, el juego ofrece reiniciar desde el primer capítulo para explorar otra ruta."

task: visualnovel-romance-routes
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-afinidad
    kind: label_match
    text: afinidad
    desc: "el HUD muestra barra de afinidad"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
