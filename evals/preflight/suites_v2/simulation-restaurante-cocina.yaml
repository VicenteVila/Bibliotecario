# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de simulación de restaurante en Godot donde llegan comandas con platos y tiempos de espera, tú asignas cocineros y camareros para preparar y servir antes de que el cliente se impaciente. El HUD muestra caja, satisfacción media, platos en cola y reloj del turno, y cada plato servido a tiempo suma propina. Victoria al cumplir la meta de ingresos del turno antes de que se cierre el local, derrota si la satisfacción media cae por debajo del umbral o se acumulan tres abandones, y tras el cierre puedes reiniciar el turno. Incluye cartas de menú con ingredientes limitados y mejora de equipamiento entre turnos."

task: simulation-restaurante-cocina
