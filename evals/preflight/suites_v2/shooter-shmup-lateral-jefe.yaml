# Suite Capa B-1 v2 — shooter-shmup-lateral-jefe (familia: Shooter)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un shooter lateral estilo shmup en Godot donde la nave avanza sola por el escenario disparando, esquivando enemigos y recogiendo mejoras de tiro, y al final de cada fase aparece un jefe con barras de vida y patrones de disparo en fases. El HUD muestra vidas, puntuación, potencia de tiro y barra de vida del jefe, y las balas enemigas tienen formas y velocidades distintas. Victoria al derrotar al jefe final con sus tres fases de patrones, derrota al perder todas las vidas, y tras game over se puede reiniciar desde la primera fase. Incluye movilidad libre en los dos ejes con teclado, power-ups temporales de tiro triple o escudo y oleadas de enemigos con curvas de vuelo predecibles."

