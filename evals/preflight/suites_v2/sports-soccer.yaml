# Suite Capa B-1 v2 — sports-soccer (familia: Sports)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de fútbol 2D de un contra uno: el jugador controla un futbolista con las flechas, chuta con espacio y debe marcar cinco goles antes que el rival controlado por la CPU. El partido dura tres minutos y un HUD muestra el marcador, el tiempo restante y qué equipo tiene el balón. Llegar primero a cinco goles o tener más goles al terminar el tiempo da la victoria; si el rival marca más, es derrota. Tras el final del partido se puede reiniciar para jugar de nuevo."

task: sports-soccer
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Futbolista, Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Futbolista, Player, Jugador, Personaje, Heroe, héroe, Character]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: cuerpo-colision
    kind: collision
    names: [Balon, Balón, Ball, Pelota]
    desc: "el balón es cuerpo físico"
  - id: hud-marcador
    kind: label_match
    text: marcador
    desc: "el HUD muestra marcador"
  - id: hud-tiempo
    kind: label_match
    text: tiempo
    desc: "el HUD muestra tiempo restante"
  - id: hud-balón
    kind: label_match
    text: balón
    desc: "el HUD muestra qué equipo tiene el balón"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-marcador
    kind: resource_within_bounds
    label: [marcador]
    max: 5
    frames: 150
    desc: "el HUD de marcador no desborda 5"
  - id: moves
    kind: moves
    names: [Futbolista, Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
