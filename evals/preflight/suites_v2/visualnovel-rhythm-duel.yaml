# Suite Capa B-1 v2 — visualnovel-rhythm-duel (familia: Visual novel)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea una novela visual de duelo mágico en Godot donde las conversaciones se resuelven con ráfagas de decisiones rápidas: mientras un oponente lanza un discurso agresivo, el jugador debe elegir la réplica antes de que se vacíe un temporizador circular mostrado en el HUD junto a la vida y la energía del héroe. Acertar la réplica correcta resta vida al rival y suma energía, fallar o dejar pasar el tiempo quita vida al jugador y rompe la cadena de combo. Entre duelos el jugador elige mejoras de hechizos que cambian el daño y la duración de los temporizadores. La victoria es derrotar al jefe final con vida restante, la derrota es que la vida llegue a cero en cualquier duelo, y tras la pantalla de resultado se puede reiniciar la aventura entera."

task: visualnovel-rhythm-duel
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vida del héroe"
  - id: hud-energ
    kind: label_match
    text: energ
    desc: "el HUD muestra energía del héroe"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
