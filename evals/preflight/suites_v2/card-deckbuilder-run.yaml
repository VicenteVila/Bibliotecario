# Suite Capa B-1 v2 — card-deckbuilder-run (familia: Card game)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de cartas tipo roguelike de construcción de mazo en Godot: el jugador recorre un mapa de nodos y elige rutas entre combates, tiendas y eventos, y en cada combate enfrenta a monstruos con mazos propios usando cartas de ataque, bloqueo y efectos especiales. Durante el combate el HUD muestra vida, maná disponible, cartas en mano, mazo y descarte, y entre combates muestra la puntuación, el piso alcanzado y las cartas ganadas. Tras vencer a un enemigo elige una de tres recompensas para añadir o mejorar cartas, y en la tienda puede gastar monedas. La victoria es derrotar al jefe del piso 10 con el HUD visible, la derrota es perder toda la vida en un combate, y desde la pantalla de resultado se puede empezar una nueva partida con un mazo inicial."

task: card-deckbuilder-run
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vida"
  - id: hud-maná
    kind: label_match
    text: maná
    desc: "el HUD muestra maná disponible"
  - id: hud-mazo
    kind: label_match
    text: mazo
    desc: "el HUD muestra mazo"
  - id: hud-descarte
    kind: label_match
    text: descarte
    desc: "el HUD muestra descarte"
  - id: hud-puntua
    kind: label_match
    text: puntua
    desc: "el HUD muestra puntuación"
  - id: hud-piso
    kind: label_match
    text: piso
    desc: "el HUD muestra piso alcanzado"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-piso
    kind: resource_within_bounds
    label: [piso]
    max: 10
    frames: 150
    desc: "el HUD de piso alcanzado no desborda 10"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
