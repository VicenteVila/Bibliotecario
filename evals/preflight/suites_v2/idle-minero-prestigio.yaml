# Suite Capa B-1 v2 — idle-minero-prestigio (familia: Idle)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego idle de minería en Godot donde picas manualmente para extraer mineral, contratas picos automáticos y desbloqueas capas más profundas del pozo que rinden más. Cuando acumulas suficiente prestigio puedes reiniciar toda la partida a cambio de un multiplicador permanente que hace que todo vuelva a crecer más rápido, y el HUD muestra mineral, ingresos por segundo, capas desbloqueadas y tu nivel de prestigio actual. Victoria al alcanzar el nivel de prestigio máximo disponible en la pantalla, derrota si el temporizador de la ronda llega a cero antes de lograrlo, y desde el final puedes empezar de nuevo. Incluye una ventana de confirmación antes de prestigiar y animación de reseteo del progreso."

task: idle-minero-prestigio
