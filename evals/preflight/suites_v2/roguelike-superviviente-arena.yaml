# Suite Capa B-1 v2 — roguelike-superviviente-arena (familia: Roguelike)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un roguelike de arena en Godot donde tu personaje ataca automáticamente y enemigos infinitos se cierran desde los bordes, tú solo mueves y esquivas. Cada vez que subes de nivel eliges una de tres mejoras visibles (alcance, cadencia, daño o armas nuevas) y el HUD muestra nivel, experiencia, vida y el tiempo sobrevivido. Victoria al llegar vivo a los 10 minutos del cronómetro marcado, derrota cuando la vida llegue a cero, y desde la pantalla final puedes reiniciar la ronda. Incluye oleadas con jefes de vida alta cada 2 minutos y orbes de experiencia que sueltan los enemigos."

task: roguelike-superviviente-arena
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: hud-nivel
    kind: label_match
    text: nivel
    desc: "el HUD muestra nivel"
  - id: hud-experiencia
    kind: label_match
    text: experiencia
    desc: "el HUD muestra experiencia"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vida"
  - id: hud-tiempo
    kind: label_match
    text: tiempo
    desc: "el HUD muestra tiempo sobrevivido"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
