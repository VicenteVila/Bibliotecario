# Suite Capa B-1 v2 — sports-bowling (familia: Sports)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de bolos 2D: el jugador lanza una bola por la pista controlando la dirección y el giro, intentando derribar todos los pinos en cada tirada. Se juegan tres rondas y un HUD muestra los puntos acumulados, la ronda actual y los pinos que quedan de pie. Superar la puntuación mínima establecida al final de las tres rondas da la victoria; quedarse por debajo causa derrota. Después de la última tirada se puede reiniciar para intentar mejorar la puntuación."

task: sports-bowling
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Bola, Ball, Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: hud-punto
    kind: label_match
    text: punto
    desc: "el HUD muestra puntos acumulados"
  - id: hud-ronda
    kind: label_match
    text: ronda
    desc: "el HUD muestra ronda actual"
  - id: hud-pino
    kind: label_match
    text: pino
    desc: "el HUD muestra pinos de pie"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-ronda
    kind: resource_within_bounds
    label: [ronda]
    max: 3
    frames: 150
    desc: "el HUD de ronda actual no desborda 3"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
