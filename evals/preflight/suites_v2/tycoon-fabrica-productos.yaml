# Suite Capa B-1 v2 — tycoon-fabrica-productos (familia: Tycoon)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de tycoon de fábrica: el jugador construye extractores de mineral, fundidoras y ensambladoras conectadas por cintas para producir y vender productos terminados. Un HUD visible muestra los recursos acumulados, la tasa de producción y las ganancias. Producir y vender 100 productos otorga la victoria; si los costos de mantenimiento superan las ganancias durante demasiado tiempo y la cuenta llega a cero, hay derrota con opción de reinicio. El jugador puede mejorar las máquinas para producir más rápido."

task: tycoon-fabrica-productos
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-recurso
    kind: label_match
    text: recurso
    desc: "el HUD muestra recursos acumulados"
  - id: hud-produc
    kind: label_match
    text: produc
    desc: "el HUD muestra tasa de producción"
  - id: hud-gananci
    kind: label_match
    text: gananci
    desc: "el HUD muestra ganancias"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
