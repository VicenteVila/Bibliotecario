# Suite Capa B-1 v2 — simulation-granja-temporadas (familia: Simulation)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de simulación de granja en Godot donde siembras cultivos en parcelas, riegas, cosechas y vendes en el mercado con precios que fluctúan cada día. Las estaciones y el clima cambian con un calendario visible, sequía o lluvia afectan el crecimiento, y el HUD muestra monedas, día, estación, clima y nivel de agua del suelo. Victoria al alcanzar la fortuna objetivo de la temporada antes de que acabe el año, derrota si te quedas sin dinero para pagar la hipoteca al final del trimestre, y tras cualquiera de los dos resultados puedes reiniciar la granja. Incluye animales que producen leche u huevos pasivamente y una pantalla de precios del mercado actualizada cada día."

task: simulation-granja-temporadas
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-moneda
    kind: label_match
    text: moneda
    desc: "el HUD muestra monedas"
  - id: hud-día
    kind: label_match
    text: día
    desc: "el HUD muestra día"
  - id: hud-estaci
    kind: label_match
    text: estaci
    desc: "el HUD muestra estación"
  - id: hud-clima
    kind: label_match
    text: clima
    desc: "el HUD muestra clima"
  - id: hud-agua
