# Suite Capa B-1 v2 — card-duel-mana-clash (familia: Card game)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de cartas de duelo por turnos en Godot frente a un rival controlado por la máquina: cada jugador tiene 30 de vida, gana una mano de cartas cada turno y acumula un recurso de maná que crece una unidad por turno para pagar cartas de ataque, defensa y hechizo. El tablero muestra las dos filas de cartas en juego, el mazo, el descarte y un HUD con vida, maná y cartas restantes de ambos bandos. El jugador arrastra cartas de su mano a la mesa, y las unidades atacan automáticamente al rival o se bloquean entre sí cuando chocan. La victoria ocurre al reducir la vida rival a cero antes que la tuya, y la derrota cuando tu vida llega a cero. La pantalla de fin de partida permite revancha inmediata para reiniciar el duelo."

task: card-duel-mana-clash
