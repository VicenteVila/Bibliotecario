# Suite Capa B-1 v2 — racing-fuel-rally (familia: Racing)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de rally 2D por etapas: el jugador conduce por un camino con curvas, recoge depósitos de combustible dispersos y debe llegar a la meta de la etapa antes de que el tanque se vacíe. El HUD muestra el nivel de combustible, la etapa actual y el tiempo transcurrido. Si el combustible se agota antes de llegar a la meta, es derrota; llegar con combustible restante da la victoria. Tras completar o fallar la etapa se puede reiniciar y volver a intentar."

task: racing-fuel-rally
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Coche, Moto, Bike, Vehiculo, Vehículo, Vehicle, Kart]
    desc: "el avatar del jugador existe como nodo"
  - id: meta-existe
