# Suite Capa B-1 v2 — roguelike-mazmorra-perdicion (familia: Roguelike)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un roguelike de mazmorra en Godot con habitaciones generadas de forma distinta en cada partida, enemigos con patrones variados y objetos que se recogen para mejorar ataque, defensa o velocidad. Cada muerte es definitiva y cierra la partida, el HUD muestra vida, piso actual, oro y mejoras activas, y una escalera al final de cada planta avanza hacia el jefe. Victoria al derrotar al jefe del piso 10, derrota al quedarte sin vidas en cualquier combate, y tras cualquiera de los dos finales puedes volver a empezar una mazmorra nueva. Incluye tienda entre plantas con oro y pociones de vida con usos limitados."

task: roguelike-mazmorra-perdicion
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vida"
  - id: hud-piso
    kind: label_match
    text: piso
    desc: "el HUD muestra piso actual"
  - id: hud-oro
    kind: label_match
    text: oro
    desc: "el HUD muestra oro"
  - id: hud-mejora
    kind: label_match
    text: mejora
    desc: "el HUD muestra mejoras activas"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-piso
    kind: resource_within_bounds
    label: [piso]
    max: 10
    frames: 150
    desc: "el HUD de piso actual no desborda 10"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
