# Suite Capa B-1 v2 — rhythm-runner (familia: Rhythm)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de carreras rítmicas 2D: el personaje corre automáticamente por el escenario y el jugador debe saltar con espacio o agacharse con flecha abajo exactamente al ritmo de la música para superar los obstáculos que aparecen en compás. Un HUD muestra la puntuación, la distancia recorrida y la precisión de los aciertos respecto al ritmo. Llegar al final del nivel con al menos una vida restante da la victoria; perder las tres vidas por fallos de ritmo causa derrota. Tras terminar o fallar se puede reiniciar el nivel desde el principio."

task: rhythm-runner
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Runner, Corredor]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Runner, Corredor]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: hud-puntua
    kind: label_match
    text: puntua
    desc: "el HUD muestra puntuación"
  - id: hud-distancia
    kind: label_match
    text: distancia
    desc: "el HUD muestra distancia recorrida"
  - id: hud-precisi
    kind: label_match
    text: precisi
    desc: "el HUD muestra precisión de los aciertos"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: jump
    kind: jump
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Runner, Corredor]
    frames: 30
    desc: "el jugador salta con ui_accept"
  - id: settles
    kind: settles
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Runner, Corredor]
    frames: 90
    desc: "el jugador se asienta en el suelo"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
