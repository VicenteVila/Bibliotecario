# Suite Capa B-1 v2 — racing-circuit (familia: Racing)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de carreras de circuito 2D: el jugador conduce un coche con las flechas, circula en un óvalo contra tres rivales controlados por la CPU y debe completar tres vueltas para ganar la carrera. Un HUD visible muestra la vuelta actual, la posición en la que va y el tiempo transcurrido. Si el jugador se sale de la pista más de cinco segundos seguidos, pierde la carrera. Al terminar, ya sea victoria o derrota, se puede reiniciar la carrera con una tecla."

task: racing-circuit
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Coche, Moto, Bike, Vehiculo, Vehículo, Vehicle, Kart]
    desc: "el avatar del jugador existe como nodo"
  - id: hud-vuelta
    kind: label_match
    text: vuelta
    desc: "el HUD muestra vuelta actual"
  - id: hud-posici
    kind: label_match
    text: posici
    desc: "el HUD muestra posición"
  - id: hud-tiempo
    kind: label_match
    text: tiempo
    desc: "el HUD muestra tiempo transcurrido"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-vuelta
    kind: resource_within_bounds
    label: [vuelta]
    max: 3
    frames: 150
    desc: "el HUD de vuelta actual no desborda 3"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character, Coche, Moto, Bike, Vehiculo, Vehículo, Vehicle, Kart]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
