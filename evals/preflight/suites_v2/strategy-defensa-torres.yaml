# Suite Capa B-1 v2 — strategy-defensa-torres (familia: Strategy)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de estrategia de defensa con oleadas: el jugador coloca torres de tipos distintos a lo largo de un camino por donde avanzan enemigos, gestionando un presupuesto de monedas. Un HUD visible muestra el oro disponible, la oleada actual, las vidas de la base y el coste de las torres. Sobrevivir 15 oleadas da la victoria; si 20 enemigos llegan al final del camino, la base pierde todas sus vidas y hay derrota con reinicio disponible. Cada oleada trae enemigos más fuertes y hay jefes en las oleadas 5, 10 y 15."

task: strategy-defensa-torres
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-oro
    kind: label_match
    text: oro
    desc: "el HUD muestra oro disponible"
  - id: hud-oleada
    kind: label_match
    text: oleada
    desc: "el HUD muestra oleada actual"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vidas de la base"
  - id: hud-coste
    kind: label_match
    text: coste
    desc: "el HUD muestra coste de las torres"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-oleada
    kind: resource_within_bounds
    label: [oleada]
    max: 15
    frames: 150
    desc: "el HUD de oleada actual no desborda 15"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
