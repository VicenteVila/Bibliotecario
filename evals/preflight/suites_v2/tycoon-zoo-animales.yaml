# Suite Capa B-1 v2 — tycoon-zoo-animales (familia: Tycoon)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de tycoon de zoológico: el jugador compra animales, construye recintos con el hábitat adecuado y cobra entrada a los visitantes, mejorando instalaciones para aumentar la satisfacción. Un HUD visible muestra el dinero, los visitantes, el número de especies y el bienestar animal. Tener 8 especies distintas con bienestar alto y acumular 10000 monedas otorga la victoria; si el bienestar animal cae demasiado por recintos inadecuados, los visitantes abandonan el zoológico y hay derrota con reinicio disponible. Un vendedor ambulante ofrece animales raros cada cierto tiempo."

task: tycoon-zoo-animales
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-dinero
    kind: label_match
    text: dinero
    desc: "el HUD muestra dinero"
  - id: hud-visitante
    kind: label_match
    text: visitante
    desc: "el HUD muestra visitantes"
  - id: hud-especie
    kind: label_match
    text: especie
    desc: "el HUD muestra número de especies"
  - id: hud-bienestar
    kind: label_match
    text: bienestar
    desc: "el HUD muestra bienestar animal"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-especie
    kind: resource_within_bounds
    label: [especie]
    max: 8
    frames: 150
    desc: "el HUD de especies no desborda 8"
  - id: ingresos-pasivos
    kind: wait_accumulates
    label: [moneda, moned, dinero, ingreso]
    frames: 400
    desc: "un contador de HUD crece sin input (economía pasiva)"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
