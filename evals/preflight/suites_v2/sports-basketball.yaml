# Suite Capa B-1 v2 — sports-basketball (familia: Sports)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de baloncesto 2D de precisión: el jugador se mueve con las flechas para posicionarse en la cancha, ajusta el ángulo y la potencia del tiro y debe encestar la pelota en el aro. Un HUD visible muestra los puntos, los tiros restantes y el tiempo disponible. Encestar al menos doce de quince tiros da la victoria; no alcanzar esa marca al agotar los tiros es derrota. Cuando la ronda termina, se puede reiniciar para intentar superar el resultado."

task: sports-basketball
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: avatar-cuerpo-fisico
    kind: node_is
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    is: CharacterBody2D
    desc: "el jugador es un cuerpo físico 2D (CharacterBody2D)"
  - id: hud-punto
    kind: label_match
    text: punto
    desc: "el HUD muestra puntos"
  - id: hud-tiro
    kind: label_match
    text: tiro
    desc: "el HUD muestra tiros restantes"
  - id: hud-tiempo
    kind: label_match
    text: tiempo
    desc: "el HUD muestra tiempo disponible"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-tiro
    kind: resource_within_bounds
    label: [tiro]
    max: 15
    frames: 150
    desc: "el HUD de tiros no desborda 15"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
