# Suite Capa B-1 v2 — puzzle-cajas-almacen (familia: Puzzle)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de puzzles de empujar cajas en Godot: el jugador mueve al personaje por una habitación y desliza cajas una casilla por pulsación, sin poder tirarlas hacia atrás, para colocarlas sobre las marcas objetivo del suelo. El HUD muestra nivel actual, movimientos usados, cajas colocadas y un temporizador opcional de parada. Victoria al cubrir todas las marcas de la pantalla, derrota si una caja queda encerrada contra una esquina y no hay forma de sacarla (con aviso y opción de reiniciar el nivel), y desde ambos resultados puedes repetir la fase o avanzar. Incluye al menos 15 niveles de dificultad creciente con muros indestructibles, hielo que desliza las cajas y un botón de deshacer el último movimiento."

task: puzzle-cajas-almacen
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: hud-nivel
    kind: label_match
    text: nivel
    desc: "el HUD muestra nivel actual"
  - id: hud-movim
    kind: label_match
    text: movim
    desc: "el HUD muestra movimientos usados"
  - id: hud-caja
    kind: label_match
    text: caja
    desc: "el HUD muestra cajas colocadas"
  - id: hud-temporiz
    kind: label_match
    text: temporiz
    desc: "el HUD muestra temporizador de parada"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: moves
    kind: moves
    names: [Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
