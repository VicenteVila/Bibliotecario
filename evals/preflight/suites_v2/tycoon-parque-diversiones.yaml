# Suite Capa B-1 v2 — tycoon-parque-diversiones (familia: Tycoon)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de tycoon de parque de diversiones: el jugador coloca atracciones como rueda de la fortuna, montaña rusa y puestos de comida, cobrando entrada a los visitantes que llegan por la calle. Un HUD visible muestra el dinero, los visitantes felices y la satisfacción media del parque. Alcanzar 5000 monedas y una satisfacción del 80% da la victoria; si el dinero baja de cero y el parque se cierra, hay derrota y se puede reiniciar. Los visitantes se quejan si no hay baños ni comida cerca de las atracciones."

task: tycoon-parque-diversiones
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-dinero
    kind: label_match
    text: dinero
    desc: "el HUD muestra dinero"
  - id: hud-visitante
    kind: label_match
    text: visitante
    desc: "el HUD muestra visitantes felices"
  - id: hud-satisfacc
    kind: label_match
    text: satisfacc
    desc: "el HUD muestra satisfacción media"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: ingresos-pasivos
    kind: wait_accumulates
    label: [moneda, moned, dinero, ingreso]
    frames: 400
    desc: "un contador de HUD crece sin input (economía pasiva)"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
