# Suite Capa B-1 v2 — sports-tennis (familia: Sports)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de tenis 2D de un contra uno: el jugador controla una raqueta con las flechas y golpea la pelota con espacio, compitiendo contra un oponente controlado por la CPU. El partido es al mejor de cinco games y un HUD muestra el marcador del game, el marcador del partido y quién saca. Ganar tres games antes que el rival da la victoria; si el rival llega primero a tres, es derrota. Tras cada partido se puede reiniciar para jugar otra vez."

task: sports-tennis
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: jugador-existe
    kind: node_exists
    names: [Raqueta, Racket, Player, Jugador, Personaje, Heroe, héroe, Character]
    desc: "el avatar del jugador existe como nodo"
  - id: hud-marcador
    kind: label_match
    text: marcador
    desc: "el HUD muestra marcador del game"
  - id: hud-game
    kind: label_match
    text: game
    desc: "el HUD muestra marcador del game"
  - id: hud-saca
    kind: label_match
    text: saca
    desc: "el HUD muestra quién saca"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-partido
    kind: resource_within_bounds
    label: [partido, games, match]
    max: 3
    frames: 150
    desc: "el HUD de games del partido no desborda 3"
  - id: moves
    kind: moves
    names: [Raqueta, Racket, Player, Jugador, Personaje, Heroe, héroe, Character]
    frames: 45
    desc: "el jugador se mueve con ui_right"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
