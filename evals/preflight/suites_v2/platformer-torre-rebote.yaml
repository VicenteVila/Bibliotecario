# Suite Capa B-1 v2 — platformer-torre-rebote (familia: Platformer)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de plataformas 2D vertical en Godot donde el jugador escala una torre apoyándose en paredes: al tocar un muro puede saltar de nuevo contra él para rebotar hacia arriba, y el movimiento aéreo permite cambiar de dirección con precisión. Hay plataformas móviles, pinchos y coleccionables repartidos en cada altura, con cámara que asciende siguiendo al jugador y HUD visible con vidas, altura máxima alcanzada y monedas. Victoria al llegar a la cima señalizada con una bandera antes de que se agote el tiempo, derrota al caer sobre los pinchos o quedarse sin vidas, y tras game over se puede reiniciar. Incluye un indicador de salto en pared y plataformas que se desmoronan al pisarlas."

task: platformer-torre-rebote
checks:
