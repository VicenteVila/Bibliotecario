# Suite Capa B-1 v2 — roguelike-cartas-sigilo (familia: Roguelike)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un roguelike de combate por cartas en Godot donde enfrentas encuentros por turnos con un mazo pequeño que crece al elegir una carta tras cada victoria. El HUD muestra vida, mano disponible, energía por turno y el mapa de la ruta con nodos de combate, elite y descanso. Victoria al recorrer la ruta completa y vencer al jefe final, derrota al perder toda la vida en cualquier encuentro, y tras cada final puedes reiniciar y barajar un viaje nuevo. Incluye cartas de ataque, defensa y efecto persistente, y un descanso que cura o mejora una carta con elección."

task: roguelike-cartas-sigilo
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vida"
  - id: hud-mano
    kind: label_match
    text: mano
    desc: "el HUD muestra mano disponible"
  - id: hud-energ
    kind: label_match
    text: energ
    desc: "el HUD muestra energía por turno"
  - id: hud-mapa
    kind: label_match
    text: mapa
    desc: "el HUD muestra mapa de la ruta"
