# Suite Capa B-1 v2 — card-lane-defense (familia: Card game)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego de cartas de defensa en carriles en Godot: el jugador tiene tres carriles y debe colocar cartas de unidades y torretas para detener oleadas de enemigos que avanzan hacia su base. Cada turno el jugador recibe cartas y energía limitada, y arrastra las cartas a un carril para invocar una unidad que lucha contra los enemigos de ese mismo carril. El HUD muestra la energía actual, la mano disponible, la vida de la base, el número de oleada y el tiempo hasta la siguiente. La victoria consiste en sobrevivir las 8 oleadas completas con la base en pie, la derrota en que la vida de la base llegue a cero. Al terminar la partida aparece un resumen con la opción de reiniciar desde la oleada uno."

task: card-lane-defense
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-energ
    kind: label_match
    text: energ
    desc: "el HUD muestra energía actual"
  - id: hud-mano
    kind: label_match
    text: mano
    desc: "el HUD muestra mano disponible"
  - id: hud-vida
    kind: label_match
    text: vida
    desc: "el HUD muestra vida de la base"
  - id: hud-oleada
    kind: label_match
    text: oleada
    desc: "el HUD muestra número de oleada"
  - id: hud-tiempo
    kind: label_match
    text: tiempo
    desc: "el HUD muestra tiempo hasta la siguiente oleada"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: cota-oleada
    kind: resource_within_bounds
    label: [oleada]
    max: 8
    frames: 150
    desc: "el HUD de oleada actual no desborda 8"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
