# Suite Capa B-1 v2 — idle-taberna-parroquianos (familia: Idle)
# Escrita 2026-10-15 desde el texto de la tarea — ANTES de cualquier generación.
# Congelada al escribirse (§5.2.2.c). Cada check verifica UNA feature pedida
# explícitamente en la instrucción; nada inventado (GameDevBench §2.2).
#
# Instrucción: "Crea un juego idle de taberna en Godot donde los parroquianos llegan solos y consumen, tú inviertes en más mesas, bardos y bebidas para aumentar la reputación y los ingresos pasivos. Hay eventos aleatorios con ventana de tiempo, como una feria o una pelea, que multiplican o reducen la ganancia y se anuncian claramente en el HUD junto a monedas, reputación, aforo y temporizador del evento. Ganas al llevar la reputación de la taberna al rango de leyenda marcado en pantalla, pierdes si la reputación llega a cero o se acaba el tiempo de la temporada, y al terminar puedes reiniciar con la taberna vacía. Incluye una cola de mejora donde cada compra encarece la siguiente y barras de progreso visibles."

task: idle-taberna-parroquianos
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"
  - id: hud-moneda
    kind: label_match
    text: moneda
    desc: "el HUD muestra monedas"
  - id: hud-reputaci
    kind: label_match
    text: reputaci
    desc: "el HUD muestra reputación"
  - id: hud-aforo
    kind: label_match
    text: aforo
    desc: "el HUD muestra aforo"
  - id: hud-evento
    kind: label_match
    text: evento
    desc: "el HUD muestra temporizador del evento"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victoria, Victory, Ganan, GameOver]
    desc: "hay un estado/nodo de victoria"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Retry, Reintentar, Reiniciar, Revancha, Menu, Nueva]
    desc: "hay un mecanismo de reinicio"
  - id: ingresos-pasivos
    kind: wait_accumulates
    label: [moneda, moned, dinero, ingreso]
    frames: 400
    desc: "un contador de HUD crece sin input (economía pasiva)"
  - id: sin-errores-de-script
    kind: no_runtime_errors
    desc: "la partida no lanza errores de script en caliente"
