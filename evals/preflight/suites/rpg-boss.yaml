# Suite Capa B-1 — rpg-boss
# Cada check verifica UNA feature pedida en la instrucción (GameDevBench §2.2).
# Ratificado 2026-10-14. Una vez en uso, NO se modifica sin benchmark nuevo.
#
# Instrucción: "RPG-lite con jefe final: el jugador explora un mapa, resuelve
# un pequeño puzzle para abrir la puerta del jefe, enfrenta al jefe final con
# un patrón de ataque simple, el jugador tiene HP y puede curarse con pociones
# del inventario, derrotar al jefe completa el juego (victoria), morir causa
# game over con reinicio, y el HUD muestra HP, pociones y la quest actual."

task: rpg-boss
checks:
  - id: build
    kind: build
    desc: "el proyecto carga en Godot headless"

  # "el jugador explora un mapa"
  - id: jugador-existe
    kind: node_exists
    names: [Player, Jugador, player]
    desc: "hay un nodo jugador"
  - id: jugador-mueve
    kind: moves
    names: [Player, Jugador, player]
    action: ui_right
    frames: 45
    desc: "el jugador se mueve bajo input de flecha"

  # "resuelve un pequeño puzzle para abrir la puerta del jefe"
  - id: puerta-existe
    kind: node_exists
    names: [Door, Puerta, door, Gate, Lock, Cerradura]
    desc: "hay una puerta del jefe"

  # "enfrenta al jefe final"
  - id: jefe-existe
    kind: node_exists
    names: [Boss, Jefe, boss, BossEnemy]
    desc: "hay un jefe final"

  # "el jugador tiene HP"
  - id: hud-hp
    kind: label_match
    text: hp
    desc: "el HUD muestra HP"

  # "puede curarse con pociones del inventario"
  - id: pociones-existen
    kind: node_exists
    names: [Potion, Pocion, Poción, pocion, Healing, Curacion]
    desc: "hay pociones"

  # "el HUD muestra HP, pociones y la quest actual"
  - id: hud-pociones
    kind: label_match
    text: pocion
    desc: "el HUD muestra pociones"
  - id: hud-quest
    kind: label_match
    text: quest
    desc: "el HUD muestra la quest actual"
  - id: hud-visible
    kind: canvas
    desc: "hay un HUD (CanvasLayer)"

  # "derrotar al jefe completa el juego (victoria)"
  - id: victoria-existe
    kind: node_exists
    names: [Win, Victory, Ganar, Victoria, Goal, Final]
    desc: "hay estado de victoria"

  # "morir causa game over con reinicio"
  - id: reinicio-existe
    kind: node_exists
    names: [Restart, Reset, Reintentar, Reiniciar, Retry, GameOver]
    desc: "hay game over con reinicio"
